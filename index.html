<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KiiPay – Wallet Verify</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="css/style.css">


<style>
body {
  margin:0; font-family:Arial;
  background:#0b1020; color:#fff;
  display:flex; justify-content:center; align-items:center; height:100vh;
}
.box {
  width:360px; background:#11162a; padding:24px;
  border-radius:14px; text-align:center;
}
button {
  width:100%; padding:14px; margin-top:10px;
  border:none; border-radius:10px; font-weight:bold; cursor:pointer;
}
.connect{background:#4f7cff;color:#fff}
.keplr{background:#8b5cf6;color:#fff}
.evm{background:#f59e0b;color:#000}
.telegram{background:#1b8bd8;color:#fff}
.disconnect{background:#374151;color:#fff}
.addr{font-size:13px;word-break:break-all;color:#a5b4fc}
.status{font-size:13px;color:#9ca3af}
.telegram:disabled{opacity:.4}
</style>
</head>

<body>
<div class="box">
<h2>🚀 KiiPay</h2>

<button id="connectBtn" class="connect" onclick="openSelector()">Connect Wallet</button>

<div id="selector" style="display:none">
  <button class="keplr" onclick="connectKeplr()">Keplr (Cosmos)</button>
  <button class="evm" onclick="connectEVM()">MetaMask (EVM)</button>
</div>

<div id="address" class="addr"></div>
<div id="status" class="status"></div>

<button id="tgBtn" class="telegram" onclick="linkTelegram()" disabled>
Continue to Telegram
</button>

<button id="disconnectBtn" class="disconnect" onclick="disconnectWallet()" style="display:none">
Disconnect
</button>
</div>

<script>
let userAddress=null, walletType=null;
const CHAIN_ID="kiichain-testnet";
const BOT="KiiPayBot"; // GANTI JIKA PERLU

function openSelector(){
  connectBtn.style.display="none";
  selector.style.display="block";
}

/* ---------- KEPLR ---------- */
async function connectKeplr(){
  if(!window.keplr) return alert("Install Keplr");
  walletType="cosmos";

  await keplr.experimentalSuggestChain({
    chainId:CHAIN_ID,
    chainName:"Kii Chain Testnet",
    rpc:"https://rpc.uno.sentry.testnet.v3.kiivalidator.com",
    rest:"https://lcd.uno.sentry.testnet.v3.kiivalidator.com",
    stakeCurrency:{coinDenom:"KII",coinMinimalDenom:"ukii",coinDecimals:6},
    bip44:{coinType:118},
    bech32Config:{
      bech32PrefixAccAddr:"kii",
      bech32PrefixAccPub:"kiipub",
      bech32PrefixValAddr:"kiivaloper",
      bech32PrefixValPub:"kiivaloperpub",
      bech32PrefixConsAddr:"kiivalcons",
      bech32PrefixConsPub:"kiivalconspub",
    },
    currencies:[{coinDenom:"KII",coinMinimalDenom:"ukii",coinDecimals:6}],
    feeCurrencies:[{coinDenom:"KII",coinMinimalDenom:"ukii",coinDecimals:6}],
    gasPriceStep:{low:0.025,average:0.03,high:0.04}
  });

  await keplr.enable(CHAIN_ID);
  const acc=(await getOfflineSigner(CHAIN_ID).getAccounts())[0];
  userAddress=acc.address;
  connected("Keplr");
}

/* ---------- EVM ---------- */
async function connectEVM(){
  if(!window.ethereum) return alert("Install MetaMask");
  walletType="evm";
  userAddress=(await ethereum.request({method:"eth_requestAccounts"}))[0];
  connected("MetaMask");
}

function connected(name){
  selector.style.display="none";
  disconnectBtn.style.display="block";
  address.innerText="✅ "+userAddress;
  status.innerText="Connected via "+name;
  tgBtn.disabled=false;
}

function disconnectWallet(){
  userAddress=null; walletType=null;
  address.innerText=""; status.innerText="";
  tgBtn.disabled=true;
  disconnectBtn.style.display="none";
  connectBtn.style.display="block";
}

/* ---------- SIGN + TELEGRAM (FIXED) ---------- */
async function linkTelegram(){
  if(!userAddress || !walletType) return;

  // 🔑 BUKA TELEGRAM DULU (USER GESTURE)
  const tgWindow = window.open(`https://t.me/${BOT}`, "_blank");

  let payload;
  const nonce = Date.now();
  const message =
`KiiPay Wallet Verification
Address: ${userAddress}
Nonce: ${nonce}`;

  if(walletType==="evm"){
    const signature = await ethereum.request({
      method:"personal_sign",
      params:[message,userAddress]
    });
    payload={ type:"evm", address:userAddress, message, signature };
  } else {
    const res = await keplr.signArbitrary(CHAIN_ID,userAddress,message);
    payload={
      type:"cosmos",
      address:userAddress,
      message,
      signature:res.signature,
      pubKey:res.pub_key.value
    };
  }

  // 🔁 REDIRECT TAB TELEGRAM KE BOT + PAYLOAD
  const data = btoa(JSON.stringify(payload));
  tgWindow.location.href =
    `https://t.me/${BOT}?start=verify_${data}`;


}
</script>
</body>
</html>

<!-- note: improve layout spacing -->
